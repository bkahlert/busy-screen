[project]
name = "busy-screen-dev"
version = "0.0.0"
description = "Development environment for the Busy Screen Debian packages and their tests"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.sources]
pihero-testkit = { git = "https://github.com/bkahlert/pihero", subdirectory = "testkit", tag = "v2.4.0" }

[dependency-groups]
dev = [
    "pihero-testkit",
    "playwright>=1.63.0",
]

[tool.pytest.ini_options]
# tests/ first: its boot and display tests read the status the provisioning posted, which the server's purge test removes.
testpaths = ["tests", "packages"]
pythonpath = ["tests"]
# testinfra's own plugin registers after the testkit's and its local-host `host` fixture would shadow the target's.
addopts = "-p pihero_testkit.plugin -p no:pytest11.testinfra --import-mode=importlib -ra"
