name: weekly
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  # A change to this workflow proves itself before it is merged.
  pull_request:
    paths: [".github/workflows/weekly.yml"]

permissions:
  contents: read

jobs:
  tier2:
    # Tier 2 needs hardware virtualization, which GitHub's Arm runners do not offer: software emulation instead, once a week.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "20" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { enable-cache: true }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-utils
      - run: uv sync --frozen
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pihero
          key: pihero-base-${{ hashFiles('.venv/lib/python*/site-packages/pihero_testkit/images.lock', '.venv/lib/python*/site-packages/pihero_testkit/prepare-rootfs') }}
      - run: make gradle npm
      # prepare-rootfs mounts the Raspberry Pi OS image through loop devices, which the runner's rootless podman
      # cannot provide, and QEMU must be able to write what the tools container creates: the VM steps run as root.
      - run: sudo -E env "PATH=$PATH" uv run --frozen playwright install --with-deps webkit
      - run: sudo -E env "PATH=$PATH" make test-tier2 QEMU_ACCEL=tcg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tier2
          path: |
            dist/tier2/**
            dist/vm/*/serial.log
          if-no-files-found: ignore
